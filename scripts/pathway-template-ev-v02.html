<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>EV干预骨骼肌损伤 · 交互信号通路图 v0.2</title>
<style>
:root{
 --bg:#f6f8fb;--card:#ffffff;--line:#e3e8f0;--line2:#d5dde8;--ink:#1d2b3a;--muted:#5d6b7c;--faint:#93a0b1;
 --A:#0e9f8e;--B:#3d7fe0;--C:#8a5cf0;--scaf:#a9b4c3;--rad:#e8594a;
 --shadow:0 1px 2px rgba(23,43,77,.06),0 6px 18px rgba(23,43,77,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Inter","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
a{color:var(--B);text-decoration:none}
button{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:9px;padding:6px 12px;cursor:pointer;transition:.15s}
button:hover{border-color:#9fb4d0;background:#f3f7fd}
button.on{background:var(--ink);border-color:var(--ink);color:#fff}
header{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:16px;padding:0 22px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);z-index:30}
.logo{display:flex;align-items:center;gap:12px}
.logo .orb{width:32px;height:32px;border-radius:10px;background:conic-gradient(from 210deg,#0e9f8e,#3d7fe0,#8a5cf0,#e8594a,#0e9f8e);box-shadow:0 4px 12px rgba(61,127,224,.25);position:relative}
.logo .orb::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
.logo b{font-size:15px;letter-spacing:.3px}
.logo small{display:block;font-size:9px;letter-spacing:2.4px;color:var(--faint)}
#hdrStats{letter-spacing:.3px;font-size:10.5px;color:#6b7a8c}
.toolbar{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.legend{display:flex;gap:14px;margin:0 8px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:22px;height:0;border-top:2.5px solid var(--A);border-radius:2px}
.legend .b .dot{border-color:var(--B)} .legend .c .dot{border-color:var(--C);border-top-style:dashed}
.legend .s .dot{border-color:var(--scaf);border-top-style:dotted}
#stage{position:absolute;inset:64px 360px 0 0;background:radial-gradient(circle at 1px 1px,#dfe5ee 1px,transparent 1.2px) 0 0/22px 22px,var(--bg)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.grab{cursor:grabbing}
.lane{stroke:none}
.lane-rad{fill:#fdeef0}.lane-musc{fill:#ebf7fb}.lane-atrophy{fill:#eef4ff}.lane-fibro{fill:#fbf5ea}.lane-vasc{fill:#ebf8f4}.lane-death{fill:#f3f0fb}.lane-mem{fill:#eef7f2}
.lane-label{font-size:12px;letter-spacing:2.5px;font-weight:700}
.ll-rad{fill:#d1475c}.ll-musc{fill:#2a8fb0}.ll-atrophy{fill:#4a74c9}.ll-fibro{fill:#b07d2a}.ll-vasc{fill:#13907d}.ll-death{fill:#7a52c9}.ll-mem{fill:#2f9b74}
.map-stats{fill:#5d6b7c;font-size:12.5px;font-weight:600;letter-spacing:.3px}
.col-label{fill:var(--faint);font-size:10.5px;letter-spacing:1.8px;text-anchor:middle;font-weight:600}
.col-rule{stroke:#d9e0ea;stroke-dasharray:2 6}
.edge path.hit{stroke:transparent;stroke-width:22;fill:none;pointer-events:stroke;cursor:pointer}
.edge path.wire{fill:none;stroke:var(--B);stroke-width:1.9;opacity:.75;transition:opacity .2s}
.edge.gA path.wire{stroke:var(--A);stroke-width:2.2;opacity:.85}
.edge.gC path.wire{stroke:var(--C);stroke-dasharray:7 6}
.edge .flow{fill:none;stroke:var(--A);stroke-width:3.2;stroke-dasharray:2 28;stroke-linecap:round;opacity:.55;pointer-events:none}
.edge.gB .flow{stroke:var(--B)}.edge.gC .flow{stroke:var(--C)}
.edge.dim{opacity:.08}
.edge.sel path.wire{stroke-width:3.6;opacity:1}
.edge-badge text{font-size:9.5px;font-weight:700;fill:#516276}
.edge-badge rect{fill:#fff;stroke:var(--line2)}
.node{cursor:pointer;transition:opacity .2s}
.node .body{fill:#fff;stroke:var(--line2);stroke-width:1;filter:drop-shadow(0 2px 3px rgba(23,43,77,.08)) drop-shadow(0 8px 14px rgba(23,43,77,.06))}
.node:hover .body{stroke:#9fb4d0}
.node.scaf .body{fill:#f8f9fb;stroke:var(--scaf);stroke-dasharray:5 4;filter:none}
.node .tt{fill:var(--ink);font-size:12.5px;font-weight:650;text-anchor:middle}
.node .st{fill:var(--muted);font-size:9.5px;text-anchor:middle}
.node .pend{fill:#98a3b3;font-size:8.5px;letter-spacing:1px;text-anchor:middle}
.node.scaf .tt{fill:#7d8898;font-weight:550}
.node .grades{font-size:8.5px;font-weight:700}
.node.sel .body{stroke:var(--ink);stroke-width:2}
.node.dim{opacity:.25}
.lang-en .node .tt{font-size:11.5px}
#side{position:fixed;top:64px;right:0;bottom:0;width:360px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
#side .pad{padding:20px 20px 40px;overflow:auto}
.stat-chip{display:inline-block;margin:0 auto 14px;padding:6px 12px;border-radius:20px;background:#f1f5fb;border:1px solid var(--line);color:#3c4d61;font-size:11.5px;line-height:1.6;font-weight:600}
.empty{color:var(--faint);text-align:center;margin-top:70px;line-height:2;font-size:12.5px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.badge{font-size:10.5px;padding:3px 10px;border-radius:20px;background:#f1f4f8;color:var(--muted);font-weight:600}
.badge.gA{background:#e3f6f3;color:#0b7f72}.badge.gB{background:#e8f0fd;color:#2b64bb}.badge.gC{background:#f0eafe;color:#6c43cc}.badge.scaf{background:#f1f3f6;color:#7d8898}
h2.sel-title{font-size:18px;margin:4px 0 4px;line-height:1.4}
.sel-sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.rel{border-top:1px solid var(--line);padding:13px 0}
.rel .rel-h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.rel .rel-h b{color:var(--ink);font-size:12.5px}
dl{margin:0}dl div{display:grid;grid-template-columns:66px 1fr;gap:8px;padding:3px 0}
dt{color:var(--faint);font-size:11px}dd{margin:0;font-size:12px;line-height:1.65}
.limit{background:#fdf6e7;border-left:3px solid #e0a83a;color:#7a5a17;padding:8px 11px;border-radius:6px;font-size:11.5px;margin-top:8px;line-height:1.65}
.refs a{display:block;font-size:11.5px;padding:8px 10px;background:#f6f8fb;border-radius:8px;margin-top:6px;border:1px solid var(--line)}
.refs a:hover{border-color:#b9cbe6}
.refs small{color:var(--faint);display:block;margin-top:2px}
.scaf-note{background:#f6f7f9;border:1px dashed var(--scaf);border-radius:9px;padding:11px;font-size:12px;color:#5d6b7c;line-height:1.7}
footer{position:fixed;left:0;bottom:0;width:calc(100% - 360px);padding:7px 20px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--faint);background:rgba(255,255,255,.9);border-top:1px solid var(--line);display:flex;gap:16px;z-index:15}
dialog{width:min(820px,94vw);max-height:86vh;overflow:auto;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(23,43,77,.2)}
dialog::backdrop{background:rgba(29,43,58,.35);backdrop-filter:blur(3px)}
.srcgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.srccard a{display:block;border:1px solid var(--line);border-radius:10px;padding:10px;background:#f8fafc;font-size:12px}
.srccard small{display:block;color:var(--faint)}
.hint{position:absolute;left:14px;bottom:44px;font-size:10.5px;color:var(--muted);background:#fff;padding:5px 10px;border-radius:7px;border:1px solid var(--line);box-shadow:var(--shadow);pointer-events:none}
body.poster #side,body.poster footer,body.poster .toolbar button,body.poster .hint,body.poster .toolbar a{display:none}
body.poster #stage{inset:64px 0 0 0}
body.poster .legend{font-size:13px}
@media(max-width:860px){
 #side{position:fixed;inset:auto 0 0 0;top:auto;width:100%;height:46%;border-left:0;border-top:1px solid var(--line)}
 #stage{inset:64px 0 46% 0}footer{display:none}.legend{display:none}
 header{gap:10px;padding:0 10px}.logo>div:last-child{display:none}.logo .orb{width:26px;height:26px;flex:none}
 .toolbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.toolbar::-webkit-scrollbar{display:none}.toolbar button{white-space:nowrap;padding:6px 10px;font-size:12px}.hint{display:none}
}
</style>

<script>
const DATA=/*__DATA__*/null;
const S={lang:'zh',filter:'all',sel:null,k:1,tx:0,ty:0};
const UI={zh:{title:'EV干预骨骼肌损伤 · 信号通路图 v0.2',lA:'A 辐射模型',lB:'B 其他损伤参照',lC:'C 体外/候选',fAll:'全部',fA:'仅辐射(A)',fit:'适配',src:'文献',classic:'教学图谱 v0.5',empty:'点任意节点或连线，查看EV来源、货物、模型、剂量、时间点、证据等级与边界。',hint:'拖动平移 · 滚轮缩放 · 点节点或连线看证据',srcTitle:'文献与方法',model:'模型',dose:'剂量/方案',time:'时间点',method:'方法',func:'功能读出',limit:'解释边界',refs:'文献',relations:'关系',node:'节点',pending:'证据待补',scafNote:'这是骨架节点，用于标出研究缺口；当前没有足够证据连证据边，不作任何因果结论。',foot1:'证据分级：A=辐射损伤模型直接证据，B=非辐射损伤模型在体EV干预参照，C=仅体外/摘要级/候选。',foot2:'动画表示方向，不代表反应速率、风险或疗效；【致病】边为EV介导的损伤机制而非治疗。',srcMethod:'每条边记录模型、剂量、时间点与解释边界。A=辐射损伤肌肉/肌源细胞的EV干预，B=非辐射损伤模型的在体EV干预参照，C=仅体外、摘要级或候选，均不等同人体临床因果。'},en:{title:'EV intervention in skeletal muscle injury · signaling map v0.2',lA:'A radiation',lB:'B other-injury ref',lC:'C in-vitro/candidate',fAll:'All',fA:'Radiation (A)',fit:'Fit',src:'Sources',classic:'Teaching atlas v0.5',empty:'Click any node or edge for EV source, cargo, model, dose, time point, evidence grade and boundary.',hint:'Drag to pan · scroll to zoom · click a node or edge',srcTitle:'Sources & methods',model:'Model',dose:'Dose / regimen',time:'Time point',method:'Method',func:'Functional readout',limit:'Interpretive boundary',refs:'References',relations:'relations',node:'Node',pending:'evidence pending',scafNote:'A scaffold node marking a research gap; there is not yet enough evidence to draw an evidence edge, and no causal claim is made.',foot1:'A = direct EV intervention in a radiation muscle model; B = in vivo EV in a non-radiation injury model; C = in vitro / abstract-level / candidate.',foot2:'Flow shows direction only; [pathogenic] edges are EV-mediated injury, not therapy.',srcMethod:'Each edge records model, dose, time and boundary. A = EV intervention in a radiation muscle/cell model, B = in vivo EV in a non-radiation injury model, C = in vitro/abstract-level/candidate; none equals human clinical causality.'}};
const t=o=>o==null?'':typeof o==='string'?o:(o[S.lang]??o.zh??'');
const GENERIC=new Set(['按v0.3逐箭头核查','audited per v0.3 edge','按原始研究读出','as reported in the original study']);
const real=o=>{const v=t(o);return v&&!GENERIC.has(v)?v:''};
const CW=232,RH=112,PADX=150,PADY=120,NW=192,NH=72;
const NS='http://www.w3.org/2000/svg';
const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};
const svg=document.getElementById('svg');
const byId=Object.fromEntries(DATA.nodes.map(n=>[n.id,n]));
const px=n=>PADX+n.c*CW, py=n=>PADY+n.r*RH;
const W=PADX*2+5*CW+NW, H=PADY*2+(DATA.rows||14.4)*RH;
const POSTER=new URLSearchParams(location.search).has('poster');
function wrap(str,max){const cjk=/[\u3000-\u9fff]/.test(str);const units=cjk?Array.from(str):str.split(' ');const lines=[];let cur='';const w=x=>Array.from(x).reduce((a,c)=>a+(/[\u3000-\u9fff\uff00-\uffef]/.test(c)?2:1),0);for(const u of units){const nx=cur?(cjk?cur+u:cur+' '+u):u;if(w(nx)>max&&cur){lines.push(cur);cur=u}else cur=nx}if(cur)lines.push(cur);return lines}
function clip(str,max){const l=wrap(str,max);return l.length>1?l[0]+'…':l[0]||''}
const _cv=document.createElement('canvas').getContext('2d');
const FONT_FAM=getComputedStyle(document.body).fontFamily;
function tw(str,px,wt){_cv.font=`${wt} ${px}px ${FONT_FAM}`;return _cv.measureText(str).width}
function tokens(str){return str.match(/[\u2e80-\u9fff\uff00-\uffef\u3000-\u303f【】（）]|[^\s\u2e80-\u9fff\uff00-\uffef\u3000-\u303f【】（）→\/·]+[→\/·]*\s*|[→\/·]+\s*|\s+/g)||[]}
function glue(toks){const CL=/^[）】」』，、。：；！？,.;:!?↑↓）)\]]+\s*$/,OP=/^[（【「『(\[]$/;const out=[];for(const tk of toks){if(out.length&&(CL.test(tk)||OP.test(out[out.length-1])))out[out.length-1]+=tk;else out.push(tk)}return out}
function fitLines(str,maxW,px,wt,maxLines){const toks=glue(tokens(str));const lines=[];let cur='';
 for(const tk of toks){const nx=cur+tk;if(tw(nx.trimEnd(),px,wt)>maxW&&cur.trim()){lines.push(cur.trimEnd());cur=tk.trimStart();}else cur=nx;}
 if(cur.trim())lines.push(cur.trimEnd());
 // hard-split any single token still too wide
 const out=[];for(const ln of lines){if(tw(ln,px,wt)<=maxW){out.push(ln);continue}let c='';for(const ch of Array.from(ln)){if(tw(c+ch,px,wt)>maxW&&c){out.push(c);c=ch}else c+=ch}if(c)out.push(c)}
 return out}
function fitTitle(str){for(const px of [12.5,11.8,11.2,10.6]){const l=fitLines(str,NW-40,px,650,2);if(l.length<=2)return{px,lines:l}}
 const px=10.6;let l=fitLines(str,NW-40,px,650,9);let a=l[0],b=l.slice(1).join('');while(tw(b+'…',px,650)>NW-40&&b.length)b=b.slice(0,-1);return{px,lines:[a,b+'…']}}
function fitSub(str){const px=9.5;if(tw(str,px,400)<=NW-24)return str;let b=str;while(b.length&&tw(b+'…',px,400)>NW-24)b=b.slice(0,-1);return b+'…'}

function edgeClass(g){return g==='A'?'gA':g==='C'?'gC':'gB'}
function edgeVisible(g){
 if(S.filter==='all')return true;
 if(S.filter==='A')return g.grade==='A';
 if(S.filter==='rt')return g.items.some(i=>i.dose&&i.dose.classes&&i.dose.classes.includes('rt'));
 return true;
}
let lastBadge=null;
const inFeed=n=>DATA.feeder&&n.r>=DATA.feeder.r0&&n.r<DATA.feeder.r1;
function rounded(pts){const r=12;let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length-1;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],[x2,y2]=pts[i+1];const l1=Math.hypot(x1-x0,y1-y0),l2=Math.hypot(x2-x1,y2-y1);const k1=Math.min(r,l1/2)/l1,k2=Math.min(r,l2/2)/l2;d+=` L${x1-(x1-x0)*k1},${y1-(y1-y0)*k1} Q${x1},${y1} ${x1+(x2-x1)*k2},${y1+(y2-y1)*k2}`;}const e=pts[pts.length-1];return d+` L${e[0]},${e[1]}`;}
function path(a,b){
 lastBadge=null;
 // orthogonal feeder routing for the v0.7 lane: run down the column gutter, along the gap above the target row, then drop in from the top
 if(inFeed(b)&&!inFeed(a)){const gx=px(a)+NW+18,fy=py(b)-20,cx=px(b)+NW/2;lastBadge={x:cx-44,y:fy};return rounded([[px(a)+NW,py(a)+NH/2],[gx,py(a)+NH/2],[gx,fy],[cx,fy],[cx,py(b)]]);}
 if(inFeed(a)&&!inFeed(b)){const fy=py(a)-20,cx=px(a)+NW/2,gx=px(b)-18;lastBadge={x:cx+(gx<cx?-44:44),y:fy};return rounded([[cx,py(a)],[cx,fy],[gx,fy],[gx,py(b)+NH/2],[px(b),py(b)+NH/2]]);}
 const x1=px(a)+NW/2,y1=py(a)+NH/2,x2=px(b)-0,y2=py(b)+NH/2;
 const sx=px(a)+NW, ex=px(b), my=(py(a)+py(b))/2+NH/2;
 // route out the right edge, into the left edge, with smooth cubic; vertical-ish links curve sideways
 const dx=px(b)-px(a);
 if(dx>0){const sx=px(a)+NW,sy=py(a)+NH/2,tx=px(b),ty=py(b)+NH/2,c=Math.max(20,(tx-sx)*0.45);return`M${sx},${sy} C${sx+c},${sy} ${tx-c},${ty} ${tx},${ty}`;}
 // same column or leftward: go through bottom/top
 const sameSide=px(b)<=px(a);
 const sy=py(a)+NH/2, ty=py(b)+NH/2;
 const sxo=sameSide?px(a):px(a)+NW, exo=sameSide?px(b):px(b)+NW;
 const off=sameSide?-70:70;
 return`M${sxo},${sy} C${sxo+off},${sy} ${exo+off},${ty} ${exo},${ty}`;
}

function draw(){
 svg.innerHTML='';placedBadges.length=0;
 const defs=el('defs');
 defs.innerHTML=`<linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#162744"/><stop offset="1" stop-color="#0e1a30"/></linearGradient>
 <radialGradient id="radGlow"><stop offset="0" stop-color="#e8594a" stop-opacity=".22"/><stop offset="1" stop-color="#e8594a" stop-opacity="0"/></radialGradient><radialGradient id="glossUnused" cx="30%" cy="22%" r="80%"><stop offset="0" stop-color="#2a4066"/><stop offset="1" stop-color="#101c34"/></radialGradient>`;
 svg.appendChild(defs);
 const root=el('g',{id:'root'});svg.appendChild(root);
 applyTransform(root);
 // lanes
 for(const L of DATA.lanes){
  const y=PADY+L.r0*RH-28,h=(L.r1-L.r0)*RH;
  root.appendChild(el('rect',{class:`lane lane-${L.id}`,x:40,y:y+4,width:W-80,height:h-8,rx:20}));
  const cy=y+h/2;const lb=el('text',{class:`lane-label ll-${L.id}`,x:72,y:cy,'text-anchor':'middle',transform:`rotate(-90 72 ${cy})`});lb.textContent=t(L);root.appendChild(lb);
 }
 // version + stats line (scales with the map)
 {const st=DATA.stats;const tx=el('text',{class:'map-stats',x:PADX-60,y:PADY-92});
  tx.textContent=S.lang==='zh'?`${DATA.versionLabel} · 纳入研究 ${st.included} 篇（A ${st.A} · B ${st.B} · C ${st.C}）· 图中文献 ${st.sources} · 节点 ${st.nodes} · 证据关系 ${st.relations}（${st.drawn} 条连线）`:`${DATA.versionLabel} · ${st.included} included studies (A ${st.A} · B ${st.B} · C ${st.C}) · ${st.sources} sources on map · ${st.nodes} nodes · ${st.relations} relations (${st.drawn} drawn edges)`;root.appendChild(tx);}
 // column headers
 DATA.cols.forEach((c,i)=>{const x=PADX+i*CW+NW/2;if(i>0)root.appendChild(el('line',{class:'col-rule',x1:PADX+i*CW-18,x2:PADX+i*CW-18,y1:PADY-20,y2:PADY+(DATA.scaffoldTop||12.35)*RH-28}));const tx=el('text',{class:'col-label',x,y:PADY-30});tx.textContent=t(c);root.appendChild(tx);});
 // edges
 const eg=el('g');root.appendChild(eg);
 for(const g of DATA.edges){
  const a=byId[g.source],b=byId[g.target];if(!a||!b)continue;
  const d=path(a,b);const vis=edgeVisible(g);
  const grp=el('g',{class:`edge ${edgeClass(g.grade)}${vis?'':' dim'}`,'data-edge':g.key});
  grp.appendChild(el('path',{class:'hit',d}));
  grp.appendChild(el('path',{class:'wire',d,'marker-end':`url(#arrow-${g.grade}${g.inhibit?'-bar':''})`}));
  if(vis){const fl=el('path',{class:'flow',d});const an=el('animate',{attributeName:'stroke-dashoffset',from:'0',to:'-180',dur:(g.grade==='C'?'3s':'2.2s'),repeatCount:'indefinite'});fl.appendChild(an);grp.appendChild(fl);}
  // badge
  const btxt=g.ids[0]+(g.ids.length>1?'+':'');const bw=Math.round(btxt.length*6.1+11);
  const mid=lastBadge||badgeSpot(d,g,bw);
  const bg=el('g',{class:'edge-badge',transform:`translate(${mid.x},${mid.y})`});
  bg.appendChild(el('rect',{x:-bw/2,y:-10,width:bw,height:20,rx:9}));
  const bt=el('text',{x:0,y:4,'text-anchor':'middle'});bt.textContent=btxt;bg.appendChild(bt);if(mid.clash)bg.setAttribute('data-clash','1');grp.appendChild(bg);
  grp.addEventListener('click',e=>{e.stopPropagation();selectEdge(g.key)});
  eg.appendChild(grp);
 }
 // arrow markers
 for(const [g,col] of [['A','var(--A)'],['B','var(--B)'],['C','var(--C)']]){
  const m=el('marker',{id:`arrow-${g}`,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto'});
  m.appendChild(el('path',{d:'M0 0L10 5L0 10Z',fill:col}));defs.appendChild(m);
  const mb=el('marker',{id:`arrow-${g}-bar`,viewBox:'0 0 12 14',refX:'8',refY:'7',markerWidth:'9',markerHeight:'10',orient:'auto'});
  mb.appendChild(el('path',{d:'M8 0V14',stroke:col,'stroke-width':'2.6'}));defs.appendChild(mb);
 }
 // nodes
 const ng=el('g');root.appendChild(ng);
 for(const n of DATA.nodes){
  const x=px(n),y=py(n),scaf=n.status==='scaffold';
  const g=el('g',{class:`node t${n.type} n-${laneOf(n)} ${scaf?'scaf':''}`,'data-node':n.id,transform:`translate(${x},${y})`});
  g.appendChild(el('rect',{class:'body',x:0,y:0,width:NW,height:NH,rx:13,fill:scaf?'#f8f9fb':'#fff'}));
  g.appendChild(el('rect',{class:'accent',x:0,y:8,width:4,height:NH-16,rx:2,fill:accent(n)}));if(!scaf){g.appendChild(el('circle',{cx:14,cy:14,r:3.2,fill:accent(n)}));}
  const ft=fitTitle(t(n.label));const lines=ft.lines;const hasSub=!!(t(n.sub)||'').trim();const y0=scaf?(lines.length>1?24:32):hasSub?(lines.length>1?27:33):(lines.length>1?32:41);
  lines.forEach((ln,i)=>{const tt=el('text',{class:'tt',x:NW/2+3,y:y0+i*16,style:`font-size:${ft.px}px`});tt.textContent=ln;g.appendChild(tt);});
  if(scaf){const p=el('text',{class:'pend',x:NW/2+3,y:NH-10});p.textContent=S.lang==='zh'?'证据待补':'evidence pending';g.appendChild(p);}
  else{const st=el('text',{class:'st',x:NW/2+3,y:lines.length>1?61:54});st.textContent=fitSub(t(n.sub)||'');g.appendChild(st);
   const gr=gradesOf(n);if(gr){const c=el('text',{class:'grades',x:NW-9,y:13,'text-anchor':'end',fill:'#9aa7b8'});c.textContent=gr;g.appendChild(c);}}
  if(n.id==='RAD'){const halo=el('circle',{cx:NW/2,cy:NH/2,r:70,fill:'url(#radGlow)','pointer-events':'none'});g.insertBefore(halo,g.firstChild);const ring=el('circle',{cx:NW/2,cy:NH/2,r:52,fill:'none',stroke:'#e8594a',"stroke-opacity":.5,'stroke-dasharray':'3 6','pointer-events':'none'});ring.appendChild(el('animateTransform',{attributeName:'transform',type:'rotate',from:`0 ${NW/2} ${NH/2}`,to:`360 ${NW/2} ${NH/2}`,dur:'18s',repeatCount:'indefinite'}));g.insertBefore(ring,g.children[1]);}
  g.addEventListener('click',e=>{e.stopPropagation();selectNode(n.id)});
  ng.appendChild(g);
 }
 svg.setAttribute('viewBox',`0 0 ${svg.clientWidth} ${svg.clientHeight}`);
}
function laneOf(n){for(const L of DATA.lanes){if(n.r>=L.r0&&n.r<L.r1)return L.id}return'dna'}
function accent(n){if(n.status==='scaffold')return'#c3cbd6';if(n.id==='RAD')return'#e8594a';const l=laneOf(n);return{rad:'#d1475c',musc:'#2a8fb0',atrophy:'#4a74c9',fibro:'#d39a36',vasc:'#13a08b',death:'#7a52c9',mem:'#2f9b74'}[l]||'#4a74c9'}
function gradesOf(n){const gs=new Set();for(const g of DATA.edges)if(g.source===n.id||g.target===n.id)g.items.forEach(i=>gs.add(i.grade));return[...gs].sort().join('')}
const placedBadges=[];
function boxHit(x,y,w,h,pad){for(const n of DATA.nodes){const nx=px(n),ny=py(n);if(x+w/2>nx-pad&&x-w/2<nx+NW+pad&&y+h/2>ny-pad&&y-h/2<ny+NH+pad)return true}for(const b of placedBadges){if(Math.abs(b.x-x)<(w+b.w)/2+4&&Math.abs(b.y-y)<h+4)return true}return false}
function badgeSpot(d,g,bw){const p=el('path',{d});svg.appendChild(p);const L=p.getTotalLength();let best=null;
 for(const f of [0.5,0.44,0.56,0.38,0.62,0.32,0.68,0.26,0.74,0.2,0.8]){const pt=p.getPointAtLength(L*f);if(!boxHit(pt.x,pt.y,bw,20,2)){best={x:pt.x,y:pt.y,w:bw};break}}
 if(!best){const pt=p.getPointAtLength(L*0.5);best={x:pt.x,y:pt.y,w:bw,clash:true}}
 svg.removeChild(p);placedBadges.push(best);g._badge=best;return best}
function midpoint(d){const p=el('path',{d});svg.appendChild(p);const L=p.getTotalLength();const pt=p.getPointAtLength(L*0.5);svg.removeChild(p);return pt}

function applyTransform(root){root=root||document.getElementById('root');if(root)root.setAttribute('transform',`translate(${S.tx},${S.ty}) scale(${S.k})`)}

function selectNode(id){S.sel={type:'node',id};renderSel();highlight()}
function selectEdge(key){S.sel={type:'edge',key};renderSel();highlight()}
function highlight(){
 const sel=S.sel;
 document.querySelectorAll('.node').forEach(g=>{g.classList.remove('sel','dim')});
 document.querySelectorAll('.edge').forEach(g=>{g.classList.remove('sel')});
 if(!sel)return;
 if(sel.type==='node'){
  const rel=DATA.edges.filter(g=>g.source===sel.id||g.target===sel.id);
  const keep=new Set([sel.id]);rel.forEach(g=>{keep.add(g.source);keep.add(g.target)});
  document.querySelector(`.node[data-node="${sel.id}"]`)?.classList.add('sel');
  document.querySelectorAll('.node').forEach(g=>{if(!keep.has(g.dataset.node))g.classList.add('dim')});
  document.querySelectorAll('.edge').forEach(g=>{if(!rel.find(r=>r.key===g.dataset.edge))g.classList.add('dim');});
 }else{
  const g=DATA.edges.find(x=>x.key===sel.key);
  document.querySelector(`.edge[data-edge="${sel.key}"]`)?.classList.add('sel');
  document.querySelectorAll('.node').forEach(n=>{if(n.dataset.node!==g.source&&n.dataset.node!==g.target)n.classList.add('dim')});
  document.querySelectorAll('.edge').forEach(e=>{if(e.dataset.edge!==sel.key)e.classList.add('dim')});
 }
}
function refCard(id){const s=DATA.sources[id];if(!s)return`<a>${id}</a>`;const href=s.pmid?`https://pubmed.ncbi.nlm.nih.gov/${s.pmid}/`:s.doi?`https://doi.org/${s.doi}`:(s.url||'#');const tag=s.pmid?`PMID ${s.pmid}`:s.doi?`DOI ${s.doi}`:(s.journal||id);return`<a href="${href}" target="_blank" rel="noreferrer" data-ref="${id}">${tag} ↗<br><span style="color:var(--muted);font-weight:400">${t(s.title)}</span><small>${s.journal?`${s.journal} · `:''}${s.pmid&&s.doi?`DOI ${s.doi} · `:""}${t(s.reviewDepth)}</small></a>`}
function relBlock(it){const L=UI[S.lang];const grade=`<span class="badge g${it.grade}">${it.grade}</span>`;
 let doseStr=t(it.doseText)||'';if(it.dose&&it.dose.regimens&&it.dose.regimens.length){const eq=it.dose.regimens.filter(r=>r.eqd2!=null).map(r=>`EQD2≈${r.eqd2} Gy`);if(eq.length)doseStr+=(doseStr?' · ':'')+eq.join(' / ');}
 if(!doseStr)doseStr='—';
 return`<div class="rel"><div class="rel-h">${grade}<b>${it.id}</b><span>${t(it.label)}</span></div>
 <dl>
 <div><dt>${L.model}</dt><dd>${t(it.model)||'—'}</dd></div>
 <div><dt>${L.dose}</dt><dd>${doseStr}</dd></div>
 <div><dt>${L.time}</dt><dd>${t(it.time)||'—'}</dd></div>
 ${real(it.method)?`<div><dt>${L.method}</dt><dd>${real(it.method)}</dd></div>`:''}
 ${real(it.functional)?`<div><dt>${L.func}</dt><dd>${real(it.functional)}</dd></div>`:''}
 </dl>
 ${it.limitation?`<div class="limit">${t(it.limitation)}</div>`:''}
 <div class="refs">${(it.refs||[]).map(refCard).join('')}</div></div>`;
}
function renderSel(){
 const box=document.getElementById('inspector');const L=UI[S.lang];
 if(!S.sel){box.innerHTML=`<div class="empty"><div class="stat-chip">${statsText()}</div>${L.empty}<br><span style="font-size:11px">${L.foot2}</span></div>`;return}
 if(S.sel.type==='node'){
  const n=byId[S.sel.id];const rel=DATA.edges.filter(g=>g.source===n.id||g.target===n.id);
  const ext=Object.entries(n.externalIds||{}).map(([k,v])=>`${k}:${v}`).join(' · ');
  if(n.status==='scaffold'){box.innerHTML=`<div class="badges"><span class="badge scaf">${L.pending}</span></div><h2 class="sel-title">${t(n.label)}</h2><p class="sel-sub">${t(n.sub)||''}</p><div class="scaf-note">${L.scafNote}</div>`;return}
  box.innerHTML=`<div class="badges"><span class="badge">${rel.length} ${L.relations}</span>${ext?`<span class="badge">${ext}</span>`:''}</div>
  <h2 class="sel-title">${t(n.label)}</h2><p class="sel-sub">${t(n.sub)||''}</p>
  ${rel.flatMap(g=>g.items).map(relBlock).join('')}`;
 }else{
  const g=DATA.edges.find(x=>x.key===S.sel.key);
  box.innerHTML=`<div class="badges"><span class="badge g${g.grade}">${g.grade}${S.lang==='zh'?'级':''}</span></div>
  <h2 class="sel-title">${t(byId[g.source].label)} ${g.inhibit?'⊣':'→'} ${t(byId[g.target].label)}</h2>
  <p class="sel-sub">${g.items.length>1?(S.lang==='zh'?`${g.items.length} 条证据关系`:`${g.items.length} evidence relations`):''}</p>
  ${g.items.map(relBlock).join('')}`;
 }
}
function statsText(){const st=DATA.stats;return S.lang==='zh'?`${DATA.versionLabel} · 纳入 ${st.included} 篇 · A ${st.A} / B ${st.B} / C ${st.C} · 文献 ${st.sources} · 节点 ${st.nodes} · 关系 ${st.relations}`:`${DATA.versionLabel} · ${st.included} studies · A ${st.A} / B ${st.B} / C ${st.C} · ${st.sources} sources · ${st.nodes} nodes · ${st.relations} relations`}
function applyLang(){
 document.documentElement.lang=S.lang==='zh'?'zh-CN':'en';document.body.classList.toggle('lang-en',S.lang==='en');
 const L=UI[S.lang];document.querySelectorAll('[data-i]').forEach(e=>{if(L[e.dataset.i]!=null)e.textContent=L[e.dataset.i]});
 document.getElementById('fLang').textContent=S.lang==='zh'?'EN':'中文';
 document.getElementById('hdrStats').textContent=statsText();
 document.querySelector('footer').innerHTML=`<span>${statsText()}</span><span>${L.foot1}</span>`;
 draw();renderSel();highlight();
}
// filters
document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{S.filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));draw();highlight();}));
document.getElementById('fLang').addEventListener('click',()=>{S.lang=S.lang==='zh'?'en':'zh';applyLang();});
document.getElementById('fFit').addEventListener('click',fit);
document.getElementById('fSrc').addEventListener('click',()=>{const L=UI[S.lang];document.getElementById('srcGrid').innerHTML=`<div style="grid-column:1/-1;font-size:12px;color:var(--muted)">${statsText()} · ${t(DATA.changelog)}</div>`+Object.keys(DATA.sources).map(refCard).map(h=>`<div class="srccard">${h}</div>`).join('');document.getElementById('srcDlg').showModal();});
document.getElementById('srcClose').addEventListener('click',()=>document.getElementById('srcDlg').close());
svg.addEventListener('click',()=>{S.sel=null;renderSel();highlight();});
// pan/zoom
let drag=null,justDragged=false;
svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,moving:false,id:e.pointerId};});
svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.moving&&Math.hypot(dx,dy)>5){drag.moving=true;svg.classList.add('grab');try{svg.setPointerCapture(drag.id)}catch(_){}}
 if(drag.moving){S.tx=drag.tx+dx;S.ty=drag.ty+dy;applyTransform();}});
const endDrag=()=>{if(drag&&drag.moving){justDragged=true;setTimeout(()=>justDragged=false,0);}drag=null;svg.classList.remove('grab')};
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('click',e=>{if(justDragged){e.stopPropagation();e.preventDefault();}},true);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const f=e.deltaY<0?1.12:1/1.12;const nk=Math.min(2.4,Math.max(0.3,S.k*f));S.tx=mx-(mx-S.tx)*(nk/S.k);S.ty=my-(my-S.ty)*(nk/S.k);S.k=nk;applyTransform();},{passive:false});
function zoomBy(f){const r=svg.getBoundingClientRect();const mx=r.width/2,my=r.height/2;const nk=Math.min(2.4,Math.max(0.3,S.k*f));S.tx=mx-(mx-S.tx)*(nk/S.k);S.ty=my-(my-S.ty)*(nk/S.k);S.k=nk;applyTransform();}
document.getElementById('zIn').addEventListener('click',()=>zoomBy(1.25));document.getElementById('zOut').addEventListener('click',()=>zoomBy(0.8));
function initialView(){const r=svg.getBoundingClientRect();if(r.width>=860||POSTER){fit();return}const k=Math.max(0.42,r.width/W);S.k=k;S.tx=-28*k;S.ty=-(PADY-118)*k;applyTransform();}
function fit(){const r=svg.getBoundingClientRect();const k=Math.min(r.width/W,r.height/H)*0.96;S.k=k;S.tx=(r.width-W*k)/2;S.ty=(r.height-H*k)/2;applyTransform();}
window.addEventListener('resize',()=>{svg.setAttribute('viewBox',`0 0 ${svg.clientWidth} ${svg.clientHeight}`)});
if(POSTER){document.body.classList.add('poster');}
applyLang();initialView();
</script>
